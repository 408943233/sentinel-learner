version: '3.8'

services:
  # Sentinel Learner API服务
  sentinel-learner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: sentinel-learner
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SENTINEL_LEARNER_MODE=server
      - SENTINEL_LEARNER_HOST=0.0.0.0
      - SENTINEL_LEARNER_PORT=8000
      - OPENCLAW_MEMORY_PATH=/shared/openclaw-memory-skill
      - TASK_STORAGE_PATH=/app/data/tasks
      - OUTPUT_PATH=/app/data/output
      - REDIS_URL=redis://redis:6379/0
      - MAX_CONCURRENT_TASKS=4
      - TASK_TIMEOUT_SECONDS=300
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.moonshot.cn/v1}
    volumes:
      # 共享OpenClaw Memory
      - /shared/openclaw:/shared/openclaw:rw
      # Task数据存储
      - ./data/tasks:/app/data/tasks:rw
      # 输出目录
      - ./data/output:/app/data/output:rw
      # 日志
      - ./logs:/app/logs:rw
      # 配置文件
      - ./config:/app/config:ro
    depends_on:
      - redis
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis任务队列
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sentinel-network
    command: redis-server --appendonly yes

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: sentinel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - sentinel-learner
    networks:
      - sentinel-network
    profiles:
      - with-nginx

volumes:
  redis-data:

networks:
  sentinel-network:
    driver: bridge
