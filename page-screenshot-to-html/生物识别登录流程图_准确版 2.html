<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生物识别登录流程图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fffef0;
            padding: 30px;
            border-radius: 8px;
            min-width: 900px;
        }
        h1 {
            text-align: center;
            font-size: 18px;
            color: #333;
            margin-bottom: 30px;
        }
        svg {
            display: block;
            margin: 0 auto;
        }
        .process-box {
            fill: #e6e6fa;
            stroke: #9999cc;
            stroke-width: 1;
            rx: 2;
        }
        .decision-diamond {
            fill: #f0f8ff;
            stroke: #9999cc;
            stroke-width: 1;
        }
        .start-end {
            fill: #e6e6fa;
            stroke: #9999cc;
            stroke-width: 1;
            rx: 15;
        }
        .node-text {
            font-size: 11px;
            fill: #333;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .arrow-line {
            fill: none;
            stroke: #666;
            stroke-width: 1;
            marker-end: url(#arrowhead);
        }
        .arrow-curve {
            fill: none;
            stroke: #666;
            stroke-width: 1;
            marker-end: url(#arrowhead);
        }
        .label-text {
            font-size: 10px;
            fill: #666;
        }
        .section-divider {
            stroke: #ccc;
            stroke-width: 1;
            stroke-dasharray: 5,5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>生物识别登录流程图</h1>
        <svg width="850" height="1400" viewBox="0 0 850 1400">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
                </marker>
            </defs>

            <!-- ========== 第一部分：生物识别功能管理流程 ========== -->
            
            <!-- 开始：用户打开登录页面/功能入口 -->
            <rect x="325" y="20" width="200" height="35" class="start-end"/>
            <text x="425" y="37" class="node-text">用户打开登录页面/功能入口</text>

            <!-- 箭头 -->
            <line x1="425" y1="55" x2="425" y2="80" class="arrow-line"/>

            <!-- 判断：设备是否支持生物识别 -->
            <polygon points="425,80 510,115 425,150 340,115" class="decision-diamond"/>
            <text x="425" y="110" class="node-text">设备是否支持</text>
            <text x="425" y="125" class="node-text">生物识别</text>

            <!-- 否分支 -->
            <path d="M 340 115 Q 280 115 280 180" class="arrow-curve"/>
            <text x="290" y="110" class="label-text">否</text>

            <!-- 不支持提示 -->
            <rect x="205" y="180" width="150" height="50" class="process-box"/>
            <text x="280" y="198" class="node-text">提示用户</text>
            <text x="280" y="213" class="node-text">当前设备不支持</text>
            <text x="280" y="228" class="node-text">生物识别登录</text>

            <!-- 箭头 -->
            <line x1="280" y1="230" x2="280" y2="260" class="arrow-line"/>

            <!-- 建议使用其他方式 -->
            <rect x="205" y="260" width="150" height="35" class="process-box"/>
            <text x="280" y="277" class="node-text">建议使用其他登录方式</text>

            <!-- 是分支 -->
            <line x1="425" y1="150" x2="425" y2="180" class="arrow-line"/>
            <text x="440" y="170" class="label-text">是</text>

            <!-- 判断：用户是否已录入生物特征 -->
            <polygon points="425,180 510,215 425,250 340,215" class="decision-diamond"/>
            <text x="425" y="210" class="node-text">用户是否已录入</text>
            <text x="425" y="225" class="node-text">生物特征</text>

            <!-- 否分支 -->
            <path d="M 510 215 Q 580 215 580 280" class="arrow-curve"/>
            <text x="550" y="210" class="label-text">否</text>

            <!-- 引导录入 -->
            <rect x="505" y="280" width="150" height="50" class="process-box"/>
            <text x="580" y="298" class="node-text">引导用户前往</text>
            <text x="580" y="313" class="node-text">"我的-设置-生物识别"</text>
            <text x="580" y="328" class="node-text">录入生物特征</text>

            <!-- 返回箭头 -->
            <path d="M 580 330 Q 580 360 510 360 Q 425 360 425 250" class="arrow-curve"/>

            <!-- 是分支 -->
            <line x1="425" y1="250" x2="425" y2="300" class="arrow-line"/>
            <text x="440" y="280" class="label-text">是</text>

            <!-- 展示生物识别登录入口 -->
            <rect x="325" y="300" width="200" height="35" class="process-box"/>
            <text x="425" y="317" class="node-text">展示生物识别登录入口</text>

            <!-- 流程说明 -->
            <text x="425" y="360" class="node-text" style="font-size: 10px; fill: #666;">
                流程说明：
            </text>
            <text x="425" y="375" class="node-text" style="font-size: 9px; fill: #666;">
                1. 首次登录需先录入生物特征
            </text>
            <text x="425" y="388" class="node-text" style="font-size: 9px; fill: #666;">
                2. 录入成功后，下次登录可直接使用生物识别
            </text>
            <text x="425" y="401" class="node-text" style="font-size: 9px; fill: #666;">
                3. 支持指纹、面容等生物识别方式
            </text>

            <!-- 分隔线 -->
            <line x1="50" y1="420" x2="800" y2="420" class="section-divider"/>

            <!-- ========== 第二部分：生物识别登录流程 ========== -->

            <!-- 标题 -->
            <text x="425" y="445" class="node-text" style="font-size: 14px; font-weight: bold;">
                生物识别登录流程
            </text>

            <!-- 开始：用户点击登录 -->
            <rect x="325" y="460" width="200" height="35" class="start-end"/>
            <text x="425" y="477" class="node-text">用户点击"登录"按钮</text>

            <!-- 箭头 -->
            <line x1="425" y1="495" x2="425" y2="520" class="arrow-line"/>

            <!-- 判断：是否开启生物识别登录 -->
            <polygon points="425,520 510,555 425,590 340,555" class="decision-diamond"/>
            <text x="425" y="550" class="node-text">是否开启</text>
            <text x="425" y="565" class="node-text">生物识别登录</text>

            <!-- 否分支 -->
            <path d="M 340 555 Q 250 555 250 620" class="arrow-curve"/>
            <text x="270" y="550" class="label-text">否</text>

            <!-- 进入传统登录流程 -->
            <rect x="175" y="620" width="150" height="35" class="process-box"/>
            <text x="250" y="637" class="node-text">进入传统登录流程</text>

            <line x1="250" y1="655" x2="250" y2="680" class="arrow-line"/>

            <!-- 输入账号密码 -->
            <rect x="175" y="680" width="150" height="35" class="process-box"/>
            <text x="250" y="697" class="node-text">输入账号密码</text>

            <!-- 是分支 -->
            <line x1="425" y1="590" x2="425" y2="620" class="arrow-line"/>
            <text x="440" y="610" class="label-text">是</text>

            <!-- 唤起生物识别验证 -->
            <rect x="325" y="620" width="200" height="35" class="process-box"/>
            <text x="425" y="637" class="node-text">唤起生物识别验证</text>

            <!-- 箭头 -->
            <line x1="425" y1="655" x2="425" y2="680" class="arrow-line"/>

            <!-- 判断：验证是否成功 -->
            <polygon points="425,680 510,715 425,750 340,715" class="decision-diamond"/>
            <text x="425" y="710" class="node-text">验证是否成功</text>
            <text x="425" y="725" class="node-text">（指纹/面容）</text>

            <!-- 失败分支 -->
            <path d="M 340 715 Q 200 715 200 780" class="arrow-curve"/>
            <text x="250" y="710" class="label-text">失败</text>

            <!-- 验证失败提示 -->
            <rect x="125" y="780" width="150" height="35" class="process-box"/>
            <text x="200" y="797" class="node-text">验证失败提示</text>

            <line x1="200" y1="815" x2="200" y2="840" class="arrow-line"/>

            <!-- 判断是否超过最大尝试次数 -->
            <polygon points="200,840 270,870 200,900 130,870" class="decision-diamond"/>
            <text x="200" y="865" class="node-text">是否超过</text>
            <text x="200" y="880" class="node-text">最大尝试次数</text>

            <!-- 否分支 - 重试 -->
            <path d="M 130 870 Q 80 870 80 715 Q 80 600 340 715" class="arrow-curve"/>
            <text x="90" y="860" class="label-text">否，重试</text>

            <!-- 是分支 -->
            <line x1="200" y1="900" x2="200" y2="930" class="arrow-line"/>
            <text x="215" y="920" class="label-text">是</text>

            <!-- 锁定生物识别 -->
            <rect x="125" y="930" width="150" height="35" class="process-box"/>
            <text x="200" y="947" class="node-text">锁定生物识别</text>

            <line x1="200" y1="965" x2="200" y2="990" class="arrow-line"/>

            <!-- 强制使用密码登录 -->
            <rect x="125" y="990" width="150" height="35" class="process-box"/>
            <text x="200" y="1007" class="node-text">强制使用密码登录</text>

            <!-- 成功分支 -->
            <line x1="425" y1="750" x2="425" y2="800" class="arrow-line"/>
            <text x="440" y="780" class="label-text">成功</text>

            <!-- 登录成功 -->
            <rect x="325" y="800" width="200" height="35" class="process-box" style="fill: #90EE90;"/>
            <text x="425" y="817" class="node-text">登录成功，进入首页</text>

            <!-- 合并箭头 -->
            <path d="M 200 1025 Q 200 1060 425 1060" class="arrow-curve"/>
            <line x1="425" y1="835" x2="425" y2="1060" class="arrow-line"/>

            <!-- 结束 -->
            <ellipse cx="425" cy="1090" rx="80" ry="25" class="start-end"/>
            <text x="425" y="1095" class="node-text">流程结束</text>

            <!-- 备注 -->
            <text x="425" y="1150" class="node-text" style="font-size: 10px; fill: #666; font-weight: bold;">
                备注：
            </text>
            <text x="425" y="1170" class="node-text" style="font-size: 9px; fill: #666;">
                1. 生物识别失败3次后自动锁定，需使用密码登录
            </text>
            <text x="425" y="1185" class="node-text" style="font-size: 9px; fill: #666;">
                2. 锁定后24小时自动解锁，或用户可手动在设置中重置
            </text>
            <text x="425" y="1200" class="node-text" style="font-size: 9px; fill: #666;">
                3. 支持iOS Face ID、Touch ID及Android指纹/面容识别
            </text>

        </svg>
    </div>
</body>
</html>
