<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生物识别登录流程图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        svg {
            display: block;
        }
        .node-rect {
            fill: #e6f3ff;
            stroke: #4a90d9;
            stroke-width: 1.5;
            rx: 4;
        }
        .node-diamond {
            fill: #fff4e6;
            stroke: #f5a623;
            stroke-width: 1.5;
        }
        .node-text {
            font-size: 12px;
            fill: #333;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .arrow-line {
            fill: none;
            stroke: #666;
            stroke-width: 1.5;
            marker-end: url(#arrowhead);
        }
        .arrow-curve {
            fill: none;
            stroke: #666;
            stroke-width: 1.5;
            marker-end: url(#arrowhead);
        }
        .label-text {
            font-size: 10px;
            fill: #666;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg width="800" height="1200" viewBox="0 0 800 1200">
            <!-- 箭头定义 -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
                </marker>
            </defs>

            <!-- 标题 -->
            <text x="400" y="30" class="node-text" style="font-size: 16px; font-weight: bold;">生物识别登录流程图</text>

            <!-- 开始节点 -->
            <rect x="300" y="60" width="200" height="40" class="node-rect"/>
            <text x="400" y="80" class="node-text">用户打开登录页面</text>

            <!-- 箭头 -->
            <line x1="400" y1="100" x2="400" y2="130" class="arrow-line"/>

            <!-- 判断：是否支持生物识别 -->
            <polygon points="400,130 480,170 400,210 320,170" class="node-diamond"/>
            <text x="400" y="170" class="node-text">设备是否支持</text>
            <text x="400" y="185" class="node-text">生物识别？</text>

            <!-- 否分支 -->
            <path d="M 320 170 Q 250 170 250 250" class="arrow-curve"/>
            <text x="260" y="180" class="label-text">否</text>

            <!-- 是分支 -->
            <line x1="400" y1="210" x2="400" y2="250" class="arrow-line"/>
            <text x="415" y="235" class="label-text">是</text>

            <!-- 判断：是否已录入 -->
            <polygon points="400,250 480,290 400,330 320,290" class="node-diamond"/>
            <text x="400" y="290" class="node-text">是否已录入</text>
            <text x="400" y="305" class="node-text">生物特征？</text>

            <!-- 否分支 - 去录入 -->
            <path d="M 480 290 Q 550 290 550 350" class="arrow-curve"/>
            <text x="520" y="285" class="label-text">否</text>

            <rect x="475" y="350" width="150" height="40" class="node-rect"/>
            <text x="550" y="370" class="node-text">引导用户录入生物特征</text>

            <!-- 返回箭头 -->
            <path d="M 550 390 Q 550 420 480 420 Q 400 420 400 330" class="arrow-curve"/>

            <!-- 是分支 -->
            <line x1="400" y1="330" x2="400" y2="420" class="arrow-line"/>
            <text x="415" y="380" class="label-text">是</text>

            <!-- 唤起生物识别 -->
            <rect x="300" y="420" width="200" height="40" class="node-rect"/>
            <text x="400" y="440" class="node-text">唤起生物识别验证</text>

            <line x1="400" y1="460" x2="400" y2="490" class="arrow-line"/>

            <!-- 判断：验证结果 -->
            <polygon points="400,490 480,530 400,570 320,530" class="node-diamond"/>
            <text x="400" y="530" class="node-text">验证是否通过？</text>

            <!-- 失败分支 -->
            <path d="M 320 530 Q 200 530 200 600" class="arrow-curve"/>
            <text x="270" y="525" class="label-text">失败</text>

            <rect x="125" y="600" width="150" height="40" class="node-rect"/>
            <text x="200" y="620" class="node-text">提示验证失败</text>

            <line x1="200" y1="640" x2="200" y2="680" class="arrow-line"/>

            <rect x="125" y="680" width="150" height="40" class="node-rect"/>
            <text x="200" y="700" class="node-text">是否重试？</text>

            <!-- 重试循环 -->
            <path d="M 275 700 Q 320 700 320 660 Q 320 620 400 570" class="arrow-curve"/>
            <text x="290" y="685" class="label-text">是</text>

            <!-- 失败结束 -->
            <path d="M 200 720 Q 200 750 300 750" class="arrow-curve"/>
            <text x="220" y="745" class="label-text">否</text>

            <rect x="300" y="730" width="200" height="40" class="node-rect" style="fill: #ffe6e6; stroke: #d94a4a;"/>
            <text x="400" y="750" class="node-text">使用其他登录方式</text>

            <!-- 成功分支 -->
            <line x1="400" y1="570" x2="400" y2="620" class="arrow-line"/>
            <text x="415" y="600" class="label-text">成功</text>

            <rect x="300" y="620" width="200" height="40" class="node-rect" style="fill: #e6ffe6; stroke: #4ad94a;"/>
            <text x="400" y="640" class="node-text">登录成功，进入首页</text>

            <!-- 流程结束 -->
            <line x1="400" y1="660" x2="400" y2="700" class="arrow-line"/>
            <ellipse cx="400" cy="720" rx="60" ry="25" class="node-rect" style="fill: #f0f0f0;"/>
            <text x="400" y="720" class="node-text">流程结束</text>

        </svg>
    </div>
</body>
</html>
