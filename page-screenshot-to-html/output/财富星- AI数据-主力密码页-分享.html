<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" c />
    <title>主力密码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            background: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        .page-container {
            position: relative;
            width: 390px;
            height: 844px;
            overflow: hidden;
            background: #2a2f6f;
        }
        /* Status Bar */
        .status-bar {
            position: absolute;
            top: 0;
            height: 47px;
            left: 0;
            right: 0;
            background: #393e73;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }
        .status-time {
            font-size: 15px;
            color: #ffffff;
            font-weight: 600;
        }
        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .signal-icon {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
        }
        .signal-bar {
            width: 3px;
            background: #ffffff;
            border-radius: 1px;
        }
        .signal-bar:nth-child(1) { height: 5px; }
        .signal-bar:nth-child(2) { height: 8px; }
        .signal-bar:nth-child(3) { height: 11px; }
        .signal-bar:nth-child(4) { height: 14px; }
        .wifi-icon {
            width: 16px;
            height: 12px;
        }
        .battery-icon {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .battery-body {
            width: 27px;
            height: 13px;
            border: 1px solid #ffffff;
            border-radius: 3px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 2px;
        }
        .battery-body::after {
            content: '';
            position: absolute;
            right: -3px;
            width: 2px;
            height: 7px;
            background: #ffffff;
            border-radius: 0 1px 1px 0;
        }
        .battery-level {
            width: 72%;
            height: 100%;
            background: #4cd964;
            border-radius: 1px;
        }
        .battery-text {
            font-size: 12px;
            color: #ffffff;
            font-weight: 600;
        }
        /* Nav Bar */
        .nav-bar {
            position: absolute;
            top: 47px;
            height: 44px;
            left: 0;
            right: 0;
            background: #292f6e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }
        .back-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }
        .nav-title {
            font-size: 17px;
            color: #ffffff;
            font-weight: 500;
        }
        .share-btn {
            font-size: 15px;
            color: #ffffff;
            padding: 4px 8px;
        }
        /* Hero Section */
        .hero-section {
            position: absolute;
            top: 91px;
            height: 209px;
            left: 0;
            right: 0;
            background: #2a2f6f;
            padding: 20px 24px;
        }
        .hero-title {
            font-size: 36px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .hero-subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-top: 8px;
            letter-spacing: 1px;
        }
        .hero-illustration {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 140px;
            height: 160px;
        }
        .lock-icon {
            position: absolute;
            right: 30px;
            top: 30px;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6b8cff 0%, #4a6cf7 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(74, 108, 247, 0.4);
        }
        .lock-icon::before {
            content: '';
            width: 32px;
            height: 40px;
            background: #ffd700;
            border-radius: 4px 4px 8px 8px;
            position: relative;
        }
        .lock-icon::after {
            content: '';
            position: absolute;
            top: 18px;
            width: 20px;
            height: 16px;
            border: 4px solid #ffd700;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
        }
        .key-icon {
            position: absolute;
            right: 90px;
            top: 60px;
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .key-icon svg {
            width: 20px;
            height: 20px;
            fill: #ffd700;
        }
        .chart-mini {
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: 40px;
            height: 40px;
            opacity: 0.3;
        }
        /* Info Card */
        .info-card {
            position: absolute;
            top: 300px;
            height: 120px;
            left: 16px;
            right: 16px;
            background: rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 16px 20px;
            backdrop-filter: blur(10px);
        }
        .info-label {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 16px;
            color: #ffffff;
            font-weight: 600;
        }
        .info-desc {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-top: 8px;
        }
        .magnifier-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            opacity: 0.2;
        }
        /* Chart Section */
        .chart-section {
            position: absolute;
            top: 420px;
            height: 200px;
            left: 0;
            right: 0;
            background: #252b6c;
        }
        .chart-tabs {
            display: flex;
            padding: 8px 16px;
            gap: 20px;
        }
        .chart-tab {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            padding: 4px 0;
        }
        .chart-tab.active {
            color: #ffffff;
            border-bottom: 2px solid #ffffff;
        }
        .chart-area {
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a205c;
        }
        .chart-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chart-candle {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 120px;
            padding: 0 40px;
        }
        .candle {
            width: 12px;
            background: #ff4757;
            border-radius: 2px;
            position: relative;
        }
        .candle::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 8px;
            background: #ff4757;
        }
        .candle::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 8px;
            background: #ff4757;
        }
        .candle:nth-child(2) { height: 60px; background: #22c55e; }
        .candle:nth-child(2)::before,
        .candle:nth-child(2)::after { background: #22c55e; }
        .candle:nth-child(3) { height: 90px; }
        .candle:nth-child(4) { height: 70px; background: #22c55e; }
        .candle:nth-child(4)::before,
        .candle:nth-child(4)::after { background: #22c55e; }
        .candle:nth-child(5) { height: 100px; }
        /* Feature Buttons */
        .feature-buttons {
            position: absolute;
            top: 620px;
            height: 80px;
            left: 0;
            right: 0;
            background: #292f70;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 16px;
        }
        .feature-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .feature-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
        }
        .feature-icon svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }
        .feature-text {
            font-size: 11px;
            color: rgba(255,255,255,0.8);
        }
        /* Star Section */
        .star-section {
            position: absolute;
            top: 700px;
            height: 300px;
            left: 0;
            right: 0;
            background: #7e7e7e;
            padding: 16px;
        }
        .star-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .star-line {
            width: 40px;
            height: 1px;
            background: rgba(255,255,255,0.3);
        }
        .star-title {
            font-size: 16px;
            color: #ffd700;
            font-weight: 600;
        }
        .star-cards {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .star-card {
            width: 110px;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
        }
        .medal {
            width: 36px;
            height: 36px;
            margin: 0 auto 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
        }
        .medal.gold {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #fff;
        }
        .medal.silver {
            background: linear-gradient(135deg, #c0c0c0, #a0a0a0);
            color: #fff;
        }
        .medal.bronze {
            background: linear-gradient(135deg, #cd7f32, #b87333);
            color: #fff;
        }
        .star-name {
            font-size: 14px;
            color: #333;
            font-weight: 600;
        }
        .star-id {
            font-size: 11px;
            color: #999;
            margin: 4px 0;
        }
        .star-rate {
            font-size: 20px;
            color: #ff4757;
            font-weight: 700;
            margin: 8px 0;
        }
        .star-days {
            font-size: 12px;
            color: #ff4757;
            background: rgba(255,71,87,0.1);
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
        }
        /* Share Sheet */
        .share-sheet {
            position: absolute;
            top: 700px;
            height: 144px;
            left: 0;
            right: 0;
            background: #ffffff;
            border-radius: 16px 16px 0 0;
            z-index: 200;
        }
        .share-title {
            text-align: center;
            font-size: 15px;
            color: #333;
            padding: 16px 0;
            font-weight: 500;
        }
        .share-options {
            display: flex;
            justify-content: space-around;
            padding: 8px 40px;
        }
        .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .share-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .share-icon.wechat {
            background: #07c160;
        }
        .share-icon.moments {
            background: #1aad19;
        }
        .share-icon svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }
        .share-text {
            font-size: 13px;
            color: #333;
        }
        .cancel-btn {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #333;
            border-top: 1px solid #f0f0f0;
            background: #ffffff;
        }
        /* Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
        }
    </style>
</head>
