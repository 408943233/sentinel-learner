<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" c />
    <title>异动揭秘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #000;
        }
        .page-container {
            position: relative;
            width: 390px;
            height: 844px;
            overflow: visible;
            margin: 0 auto;
            background: #171e56;
        }
        /* Status Bar */
        .status-bar {
            position: absolute;
            top: 0;
            height: 47px;
            left: 0;
            right: 0;
            background: #393e73;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }
        .status-time {
            font-size: 17px;
            font-weight: 600;
            color: #fff;
        }
        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .signal-icon {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 16px;
        }
        .signal-bar {
            width: 3px;
            background: #fff;
            border-radius: 1px;
        }
        .signal-bar:nth-child(1) { height: 4px; }
        .signal-bar:nth-child(2) { height: 7px; }
        .signal-bar:nth-child(3) { height: 10px; }
        .signal-bar:nth-child(4) { height: 13px; opacity: 0.4; }
        .wifi-icon {
            width: 18px;
            height: 14px;
        }
        .battery-icon {
            width: 28px;
            height: 14px;
            border: 1.5px solid #fff;
            border-radius: 3px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 2px;
        }
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 6px;
            background: #fff;
            border-radius: 0 1px 1px 0;
        }
        .battery-level {
            width: 72%;
            height: 100%;
            background: #4cd964;
            border-radius: 1px;
        }
        .battery-text {
            position: absolute;
            font-size: 9px;
            color: #fff;
            font-weight: 600;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        /* Nav Bar */
        .nav-bar {
            position: absolute;
            top: 47px;
            height: 44px;
            left: 0;
            right: 0;
            background: #383e73;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }
        .nav-back {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-back svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }
        .nav-title {
            font-size: 17px;
            color: #fff;
            font-weight: 500;
        }
        .nav-share {
            font-size: 15px;
            color: #fff;
            padding: 4px 8px;
        }
        /* Hero Section */
        .hero-section {
            position: absolute;
            top: 91px;
            height: 200px;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, #383e73 0%, #2e3471 100%);
            padding: 20px 24px;
        }
        .hero-title {
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        .hero-subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 16px;
        }
        .video-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 8px 20px;
            color: #fff;
            font-size: 15px;
        }
        .video-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }
        .hero-illustration {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 140px;
            height: 140px;
        }
        .shield-bg {
            position: absolute;
            width: 100px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            right: 20px;
            top: 10px;
            opacity: 0.3;
        }
        .arrow-up {
            position: absolute;
            right: 40px;
            top: 30px;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 70px solid #ff6b6b;
            transform: rotate(-15deg);
        }
        .arrow-up::after {
            content: '';
            position: absolute;
            left: -25px;
            top: 70px;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 20px solid #ff6b6b;
        }
        .coin-icon {
            position: absolute;
            right: 15px;
            bottom: 30px;
            width: 36px;
            height: 36px;
            background: #ffd93d;
            border-radius: 50%;
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #ff6b00;
            font-weight: bold;
        }
        /* Info Card */
        .info-card {
            position: absolute;
            top: 291px;
            height: 180px;
            left: 16px;
            right: 16px;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 20px;
            z-index: 10;
        }
        .info-card-text {
            font-size: 15px;
            color: #333;
            line-height: 1.8;
        }
        .info-card-text .highlight {
            color: #2a306f;
            font-weight: 600;
        }
        .search-icon {
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: 50px;
            height: 50px;
            opacity: 0.15;
        }
        .search-icon svg {
            width: 100%;
            height: 100%;
            fill: #2a306f;
        }
        /* Feature Tabs */
        .feature-tabs {
            position: absolute;
            top: 471px;
            height: 56px;
            left: 0;
            right: 0;
            background: #252a6c;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            overflow-x: auto;
        }
        .feature-tab {
            padding: 8px 16px;
            color: rgba(255,255,255,0.6);
            font-size: 15px;
            white-space: nowrap;
            border-radius: 4px;
        }
        .feature-tab.active {
            color: #fff;
            font-weight: 600;
            position: relative;
        }
        .feature-tab.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: #fff;
            border-radius: 2px;
        }
        /* Detail Section */
        .detail-section {
            position: absolute;
            top: 527px;
            height: 317px;
            left: 0;
            right: 0;
            background: #2a2f6f;
            padding: 16px;
        }
        .detail-card {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 20px;
            height: 100%;
        }
        .detail-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .detail-header-line {
            width: 40px;
            height: 2px;
            background: #2a306f;
            opacity: 0.3;
        }
        .detail-header-title {
            font-size: 20px;
            font-weight: 700;
            color: #2a306f;
        }
        .detail-content {
            font-size: 15px;
            color: #333;
            line-height: 1.8;
        }
        .detail-case {
            margin-top: 12px;
            font-size: 15px;
            color: #333;
            line-height: 1.8;
        }
        .detail-case .case-label {
            color: #2a306f;
            font-weight: 600;
        }
        .detail-case .highlight-date {
            color: #2a306f;
            font-weight: 600;
        }
        /* Share Modal */
        .share-modal {
            position: absolute;
            top: 650px;
            height: 194px;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 16px 16px 0 0;
            z-index: 200;
        }
        .share-modal-overlay {
            position: absolute;
            top: 0;
            height: 650px;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.4);
            z-index: 199;
        }
        .share-title {
            text-align: center;
            font-size: 17px;
            color: #333;
            font-weight: 500;
            padding: 20px 0;
        }
        .share-options {
            display: flex;
            justify-content: space-around;
            padding: 16px 40px;
        }
        .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .share-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .share-icon.wechat {
            background: #07c160;
        }
        .share-icon.moment {
            background: #07c160;
        }
        .share-icon svg {
            width: 32px;
            height: 32px;
            fill: #fff;
        }
        .share-label {
            font-size: 14px;
            color: #333;
        }
        .share-cancel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: #333;
            border-top: 1px solid #e5e5e5;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-time">13:53</div>
            <div class="status-icons">
                <div class="signal-icon">
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                </div>
                <svg class="wifi-icon" viewBox="0 0 24 24" fill="#fff">
                    <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
                </svg>
                <div class="battery-icon">
                    <div class="battery-level"></div>
                    <span class="battery-text">72</span>
                </div>
            </div>
        </div>
        <!-- Nav Bar -->
        <div class="nav-bar">
            <div class="nav-back">
                <svg viewBox="0 0 24 24">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </div>
            <div class="nav-title"></div>
            <div class="nav-share">分享</div>
        </div>
        <!-- Hero Section -->
        <div class="hero-section">
            <div class="hero-title">异动揭秘</div>
            <div class="hero-subtitle">洞察主力成本，追踪吸筹轨迹</div>
            <div class="video-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <span>视频教程</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                </svg>
            </div>
            <div class="hero-illustration">
                <div class="shield-bg"></div>
                <div class="arrow-up"></div>
                <div class="coin-icon">$</div>
            </div>
        </div>
        <!-- Info Card -->
        <div class="info-card">
            <div class="info-card-text">
                本策略由<span class="highlight">2</span>个Level 2指标和<span class="highlight">4</span>个Level 2异动监控池构成，其特色功能有<span class="highlight">主力跟踪</span>、<span class="highlight">资金博弈</span>、<span class="highlight">拖拉机单</span>、主力撤单、顶级挂单和涨停承压。
            </div>
            <div class="search-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </div>
        </div>
        <!-- Feature Tabs -->
        <div class="feature-tabs">
            <div class="feature-tab active">主力跟踪</div>
            <div class="feature-tab">资金博弈</div>
            <div class="feature-tab">拖拉机单</div>
            <div class="feature-tab">顶级挂单</div>
            <div class="feature-tab">主力撤单</div>
        </div>
        <!-- Detail Section -->
        <div class="detail-section">
            <div class="detail-card">
                <div class="detail-header">
                    <div class="detail-header-line"></div>
                    <div class="detail-header-title">主力跟踪指标</div>
                    <div class="detail-header-line"></div>
                </div>
                <div class="detail-content">
                    主力跟踪按照股价的形态分析，计算主力运行轨迹，并且依据资金流入流出判断主力操盘阶段：吸筹、建仓、拉高、出货。
                </div>
                <div class="detail-case">
                    <span class="case-label">案例：</span><span class="highlight-date">2023年5月16日至2023年6月19日</span>期间，林***(0*****)股票处于上涨趋势，主力跟踪指标根据股价
                </div>
            </div>
        </div>
        <!-- Share Modal Overlay -->
        <div class="share-modal-overlay"></div>
        <!-- Share Modal -->
        <div class="share-modal">
            <div class="share-title">分享至</div>
            <div class="share-options">
                <div class="share-option">
                    <div class="share-icon wechat">
                        <svg viewBox="0 0 24 24">
                            <path d="M8.5 13.5A1.5 1.5 0 1 1 10 12a1.5 1.5 0 0 1-1.5 1.5zm7 0A1.5 1.5 0 1 1 17 12a1.5 1.5 0 0 1-1.5 1.5zm-3.5 6c4.5 0 8-2.5 8-6s-3.5-6-8-6-8 2.5-8 6c0 2 1 3.5 2.5 4.5-.5 1.5-1.5 2.5-1.5 2.5s2-.5 3.5-1.5c.5.5 1.5.5 2 .5z"/>
                        </svg>
                    </div>
                    <div class="share-label">微信好友</div>
                </div>
                <div class="share-option">
                    <div class="share-icon moment">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm-1-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm5 7h-2v-3c0-.55-.45-1-1-1s-1 .45-1 1v3h-2v-6h2v.5c.5-.5 1.5-1 2.5-1 1.5 0 2.5 1 2.5 2.5v4z"/>
                        </svg>
                    </div>
                    <div class="share-label">微信朋友圈</div>
                </div>
            </div>
            <div class="share-cancel">取消</div>
        </div>
    </div>
</body>
</html>
