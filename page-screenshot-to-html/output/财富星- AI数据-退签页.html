<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" c />
    <title>退签</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .page-container {
            position: relative;
            width: 390px;
            height: 948px;
            overflow: visible;
            margin: 0 auto;
            background: #ffffff;
        }
        /* Status Bar */
        .status-bar {
            position: absolute;
            top: 0;
            height: 47px;
            left: 0;
            right: 0;
            background: #434cc0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }
        .status-time {
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .signal-icon {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
        }
        .signal-bar {
            width: 3px;
            background: #ffffff;
            border-radius: 1px;
        }
        .signal-bar:nth-child(1) { height: 5px; }
        .signal-bar:nth-child(2) { height: 8px; }
        .signal-bar:nth-child(3) { height: 11px; }
        .signal-bar:nth-child(4) { height: 14px; }
        .wifi-icon {
            width: 18px;
            height: 14px;
        }
        .battery-icon {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .battery-body {
            width: 27px;
            height: 13px;
            border: 1px solid #ffffff;
            border-radius: 3px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 1px;
        }
        .battery-body::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 4px;
            width: 2px;
            height: 5px;
            background: #ffffff;
            border-radius: 0 1px 1px 0;
        }
        .battery-fill {
            width: 80%;
            height: 100%;
            background: #4cd964;
            border-radius: 1px;
        }
        .battery-text {
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
        }
        /* Nav Bar */
        .nav-bar {
            position: absolute;
            top: 47px;
            height: 44px;
            left: 0;
            right: 0;
            background: #434cc0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .nav-back {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-back svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }
        .nav-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
        }
        /* Content Area */
        .content-area {
            position: absolute;
            top: 91px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ffffff;
            overflow: visible;
        }
        /* Service Notice Section */
        .service-notice {
            padding: 20px 16px 0;
            text-align: center;
        }
        .notice-text {
            color: #333333;
            font-size: 16px;
            line-height: 1.6;
        }
        .notice-text .highlight {
            color: #434cc0;
        }
        /* Service Grid */
        .service-grid {
            display: flex;
            flex-wrap: wrap;
            padding: 24px 16px 0;
            gap: 0;
        }
        .service-item {
            width: 33.333%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .service-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #fef3e2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            position: relative;
        }
        .service-icon svg {
            width: 28px;
            height: 28px;
        }
        /* Star icon for 主力密码 */
        .icon-star {
            fill: #e6a23c;
        }
        /* Chart icon for 异动揭秘 */
        .icon-chart {
            fill: #e6a23c;
        }
        /* Refresh icon for 融资追击 */
        .icon-refresh {
            fill: #e6a23c;
        }
        /* VIP icon */
        .icon-vip {
            fill: #e6a23c;
        }
        /* Gold icon for 陆港淘金 */
        .icon-gold {
            fill: #e6a23c;
        }
        .service-name {
            color: #333333;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .service-desc {
            color: #999999;
            font-size: 12px;
        }
        /* Divider */
        .divider {
            height: 8px;
            background: #f7f6fb;
            margin: 8px 0;
        }
        /* Survey Section */
        .survey-section {
            padding: 20px 16px;
        }
        .survey-title {
            color: #333333;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .option-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .checkbox {
            width: 20px;
            height: 20px;
            border: 1.5px solid #cccccc;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .option-text {
            color: #333333;
            font-size: 15px;
        }
        /* Other Reason */
        .other-reason {
            margin-top: 20px;
        }
        .other-label {
            color: #333333;
            font-size: 15px;
            margin-bottom: 12px;
        }
        .other-input {
            width: 100%;
            height: 80px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 12px;
            font-size: 14px;
            color: #999999;
            resize: none;
            outline: none;
        }
        /* Bottom Area */
        .bottom-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: #ffffff;
        }
        .submit-btn {
            width: 100%;
            height: 48px;
            background: #434cc0;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <span class="status-time">14:55</span>
            <div class="status-icons">
                <div class="signal-icon">
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                </div>
                <svg class="wifi-icon" viewBox="0 0 24 24" fill="#ffffff">
                    <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
                </svg>
                <div class="battery-icon">
                    <div class="battery-body">
                        <div class="battery-fill"></div>
                    </div>
                    <span class="battery-text">80</span>
                </div>
            </div>
        </div>
        <!-- Nav Bar -->
        <div class="nav-bar">
            <div class="nav-back">
                <svg viewBox="0 0 24 24">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </div>
            <span class="nav-title">退签</span>
        </div>
        <!-- Content Area -->
        <div class="content-area">
            <!-- Service Notice -->
            <div class="service-notice">
                <p class="notice-text">
                    "财富星-AI数据"已陪伴您<span class="highlight">0</span>天，取消后将不再享受<br />以下服务：
                </p>
            </div>
            <!-- Service Grid -->
            <div class="service-grid">
                <div class="service-item">
                    <div class="service-icon">
                        <svg class="icon-star" viewBox="0 0 24 24">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                    </div>
                    <span class="service-name">主力密码</span>
                    <span class="service-desc">洞悉主力动向</span>
                </div>
                <div class="service-item">
                    <div class="service-icon">
                        <svg class="icon-chart" viewBox="0 0 24 24">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
                        </svg>
                    </div>
                    <span class="service-name">异动揭秘</span>
                    <span class="service-desc">识别大单异动</span>
                </div>
                <div class="service-item">
                    <div class="service-icon">
                        <svg class="icon-refresh" viewBox="0 0 24 24">
                            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                        </svg>
                    </div>
                    <span class="service-name">融资追击</span>
                    <span class="service-desc">透视融资数据</span>
                </div>
                <div class="service-item">
                    <div class="service-icon">
                        <svg class="icon-vip" viewBox="0 0 24 24">
                            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                        </svg>
                    </div>
                    <span class="service-name">VIP快讯</span>
                    <span class="service-desc">实时推送市场重要快讯</span>
                </div>
                <div class="service-item">
                    <div class="service-icon">
                        <svg class="icon-gold" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.59 0-.83-.44-1.61-2.67-2.14-2.48-.6-4.18-1.62-4.18-3.67 0-1.72 1.39-2.84 3.11-3.21V4h2.67v1.95c1.86.45 2.79 1.86 2.85 3.39H14.3c-.05-1.11-.64-1.87-2.22-1.87-1.5 0-2.4.68-2.4 1.64 0 .84.65 1.39 2.67 1.91s4.18 1.39 4.18 3.91c-.01 1.83-1.38 2.83-3.12 3.16z"/>
                        </svg>
                    </div>
                    <span class="service-name">陆港淘金</span>
                    <span class="service-desc">一江之隔，价差几何</span>
                </div>
            </div>
            <!-- Divider -->
            <div class="divider"></div>
            <!-- Survey Section -->
            <div class="survey-section">
                <p class="survey-title">您取消签约的原因是什么？(可多选)</p>
                <div class="option-list">
                    <div class="option-item">
                        <div class="checkbox"></div>
                        <span class="option-text">1、产品业绩太差</span>
                    </div>
                    <div class="option-item">
                        <div class="checkbox"></div>
                        <span class="option-text">2、产品收费太贵</span>
                    </div>
                    <div class="option-item">
                        <div class="checkbox"></div>
                        <span class="option-text">3、服务不好</span>
                    </div>
                    <div class="option-item">
                        <div class="checkbox"></div>
                        <span class="option-text">4、资讯不及时或内容对投资没有帮助</span>
                    </div>
                    <div class="option-item">
                        <div class="checkbox"></div>
                        <span class="option-text">5、短信发送太频繁</span>
                    </div>
                    <div class="option-item">
                        <div class="checkbox"></div>
                        <span class="option-text">6、客户经理让我退签</span>
                    </div>
                </div>
                <div class="other-reason">
                    <p class="other-label">其他原因</p>
                    <textarea class="other-input" placeholder="其他原因"></textarea>
                </div>
            </div>
            <!-- Bottom Area -->
            <div class="bottom-area">
                <button class="submit-btn">确认退签</button>
            </div>
        </div>
    </div>
</body>
</html>
